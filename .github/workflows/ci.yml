name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused by release.yml so nothing ships without passing

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (incl. partition script execution against stubs)
        run: npm test
      - name: Build
        run: npx vite build

  rust-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev pkg-config libdbus-1-dev libsecret-1-dev
      # tauri::generate_context! needs frontendDist to exist
      - run: mkdir -p dist
      - name: cargo test (locked)
        working-directory: src-tauri
        run: cargo test --locked --lib

  rust-check:
    # Compile the platform-specific code paths (e.g. the Windows local shell)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: mkdir -p dist
        shell: bash
      - name: cargo check (locked)
        working-directory: src-tauri
        run: cargo check --locked --all-targets
